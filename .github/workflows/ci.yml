name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Varlock scan
        run: npx varlock scan

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Varlock validates every @required @sensitive item in .env.schema at
          # load time. CI has no Bitwarden access, so we override every
          # bitwarden(...) value with a placeholder — varlock uses the env var
          # and never invokes the plugin. BWS_SECRETS_TOKEN has to be a
          # syntactically valid bitwardenAccessToken for @initBitwarden to pass
          # (the plugin validates format at init but lazy-connects on demand).
          #
          # Values MUST be distinctive random strings so varlock's post-build
          # leak scan doesn't match them against incidental substrings in the
          # compiled output (e.g. the literal word "placeholder" appears in
          # rendered HTML placeholder="" attributes).
          BWS_SECRETS_TOKEN: "0.00000000-0000-0000-0000-000000000000.00000000-0000-0000-0000-000000000000:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          NEXT_PUBLIC_SUPABASE_URL: https://everythingrent-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: sbp_ci_build_only_qzx8mk2arv9nlf4jh7dc3pnw6eyy5tt1
          SUPABASE_SERVICE_ROLE_KEY: sbs_ci_build_only_qzx8mk2arv9nlf4jh7dc3pnw6eyy5tt1
          STRIPE_SECRET_KEY: sk_test_ci_build_only_QzX8mK2aRv9nLf4Jh7Dc3PnW6eYy5tT1
          STRIPE_WEBHOOK_SECRET: whsec_ci_build_only_QzX8mK2aRv9nLf4Jh7Dc3PnW6eYy5tT1
          TWILIO_ACCOUNT_SID: ACciBuildOnlyQzX8mK2aRv9nLf4Jh7Dc3PnW6eYy5tT1
          TWILIO_AUTH_TOKEN: ci_build_only_QzX8mK2aRv9nLf4Jh7Dc3PnW6eYy5tT1
          TWILIO_PHONE_NUMBER: "+15555550123"
