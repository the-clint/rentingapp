# Everything.Rent — Netlify build configuration
# ==============================================
# Secrets are NOT set here. This file only configures build behavior and the
# `APP_ENV` flag that tells varlock which Bitwarden project to resolve against
# at build time. The machine-account token (`BWS_SECRETS_TOKEN`) is configured
# per deploy context in the Netlify UI:
#   - Production context: points at the `everything-rent-prod` BWS project.
#   - Deploy-preview + Branch-deploy contexts: point at `everything-rent-dev`.
#
# See docs/bitwarden-secrets-setup.md for the full runbook.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Production deploys (main branch → live site).
[context.production.environment]
  APP_ENV = "production"

# Pull-request preview deploys.
[context.deploy-preview.environment]
  APP_ENV = "preview"

# Non-main branch deploys (same secrets as deploy-preview).
[context.branch-deploy.environment]
  APP_ENV = "preview"
